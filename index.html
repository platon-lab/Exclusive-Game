<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ігровий Хаб Улюбленців</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            padding: 40px;
            text-align: center;
            max-width: 900px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        /* Приховати скроллбар для краси */
        .glass-panel::-webkit-scrollbar { display: none; }
        .glass-panel { -ms-overflow-style: none; scrollbar-width: none; }

        h1, h2 {
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Вибір персонажа */
        .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .character-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .character-card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .character-card img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 10px;
            border: 3px solid rgba(255,255,255,0.5);
        }

        /* Хаб ігор */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .game-btn {
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0));
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(4px);
        }

        .game-btn:hover {
            background: rgba(255,255,255,0.25);
            transform: scale(1.05);
        }

        /* Ігровий Canvas */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 500px;
            margin: 0 auto;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--glass-border);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
            pointer-events: none;
        }

        .back-btn {
            margin-bottom: 20px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: 1px solid white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: white;
            color: black;
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid white;
            text-align: center;
            display: none;
        }

        /* === МОБІЛЬНИЙ ДЖОЙСТИК === */
        #mobile-controls {
            display: none;
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            pointer-events: none;
        }

        #joystick-zone {
            position: absolute;
            bottom: 10px;
            left: 15px;
            width: 120px;
            height: 120px;
            pointer-events: all;
        }

        #joystick-base {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.4);
            position: relative;
        }

        #joystick-knob {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.6);
            position: absolute;
            top: 35px;
            left: 35px;
            transition: none;
        }

        #action-btn {
            position: absolute;
            bottom: 30px;
            right: 20px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 200, 0, 0.7);
            border: 3px solid rgba(255,255,255,0.6);
            color: white;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: all;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        #tap-hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            pointer-events: none;
            text-align: center;
        }

        /* Показувати мобільний контроль тільки на тачскрінах */
        @media (hover: none) and (pointer: coarse) {
            #mobile-controls { display: block; }
        }

    </style>
</head>
<body>

    <div class="glass-panel" id="main-panel">
        
        <div id="screen-select" class="screen active">
            <h1>Обери свого героя</h1>
            <p>Хто сьогодні стане чемпіоном?</p>
            <div class="character-grid">
                <div class="character-card" onclick="selectCharacter('Persik.png')">
                    <img src="Persik.png" alt="Персик" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iI2ZmYTA3YSIvPjwvc3ZnPg=='">
                    <h3>Персик</h3>
                </div>
                <div class="character-card" onclick="selectCharacter('Spike.png')">
                    <img src="Spike.png" alt="Спайк" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iIzQ2OGFhZCIvPjwvc3ZnPg=='">
                    <h3>Спайк</h3>
                </div>
                <div class="character-card" onclick="selectCharacter('Lilu.png')">
                    <img src="Lilu.png" alt="Лилу" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iI2QyYjRkYyIvPjwvc3ZnPg=='">
                    <h3>Лилу</h3>
                </div>
                <div class="character-card" onclick="selectCharacter('Alyonka.png')">
                    <img src="Alyonka.png" alt="Альонка" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iI2ZmZDcwMCIvPjwvc3ZnPg=='">
                    <h3>Альонка</h3>
                </div>
            </div>
        </div>

        <div id="screen-hub" class="screen">
            <button class="back-btn" onclick="showScreen('screen-select')">Назад до вибору</button>
            <h2>У що граємо?</h2>
            <div class="games-grid">
                <button class="game-btn" onclick="startGame('runner', 1)">🏃 1. Класичний Забіг</button>
                <button class="game-btn" onclick="startGame('catcher', 1)">🍪 2. Ловець Смаколиків</button>
                <button class="game-btn" onclick="startGame('flappy', 1)">🐦 3. Повітряний Політ</button>
                <button class="game-btn" onclick="startGame('runner', 1.5)">⚡ 4. Швидкісний Раннер</button>
                <button class="game-btn" onclick="startGame('catcher', 1.5)">☄️ 5. Метеоритний Дощ</button>
                <button class="game-btn" onclick="startGame('flappy', 1.3)">🪨 6. Вузькі Печери</button>
                <button class="game-btn" onclick="startGame('runner', 2)">🚀 7. Турбо Забіг</button>
                <button class="game-btn" onclick="startGame('catcher', 2)">🌪️ 8. Божевільний Ловець</button>
                <button class="game-btn" onclick="startGame('flappy', 1.8)">🌀 9. Гравітаційна Аномалія</button>
                <button class="game-btn" onclick="startGame('survival', 1)">🛡️ 10. Режим Виживання</button>
                <button class="game-btn" onclick="startGame('snake', 1)">🐍 11. Змійка</button>
                <button class="game-btn" onclick="startGame('breakout', 1)">🧱 12. Розбиватель Блоків</button>
                <button class="game-btn" onclick="startGame('maze', 1)">🌿 13. Лабіринт</button>
                <button class="game-btn" onclick="startGame('shooter', 1)">🎯 14. Зоряний Стрілець</button>
                <button class="game-btn" onclick="startGame('bounce', 1)">⚽ 15. Відбивайло</button>
                <button class="game-btn" onclick="startGame('gravity', 1)">🪐 16. Гравітаційний Стрибун</button>
                <button class="game-btn" onclick="startGame('dodge', 1)">💨 18. Ухилятор</button>
                <button class="game-btn" onclick="startGame('collector', 1)">⭐ 19. Збирач Зірок</button>
                <button class="game-btn" onclick="startGame('bubble', 1)">🫧 20. Бульбашки</button>
            </div>
        </div>

    </div>

    <div id="screen-game" class="screen" style="width: 100%; height: 100vh; position: absolute; top:0; left:0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); display: none; flex-direction: column; justify-content: center; align-items: center;">
        <div style="width: 100%; max-width: 800px; display: flex; justify-content: space-between; padding: 10px;">
            <button class="back-btn" onclick="exitGame()">Вийти в меню</button>
            <div style="color: white; font-size: 24px; font-weight: bold;" id="game-title">Назва гри</div>
        </div>
        <div id="game-container">
            <canvas id="gameCanvas" width="800" height="500"></canvas>
            <div class="hud">
                <div id="scoreDisplay">Рахунок: 0</div>
                <div id="livesDisplay">Життя: 3</div>
            </div>
            <div id="game-over">
                <h2>Гру Закінчено</h2>
                <p id="final-score">Ваш рахунок: 0</p>
                <button class="back-btn" id="restart-btn">Спробувати ще раз</button>
            </div>

            <!-- МОБІЛЬНЕ КЕРУВАННЯ -->
            <div id="mobile-controls">
                <div id="joystick-zone">
                    <div id="joystick-base">
                        <div id="joystick-knob"></div>
                    </div>
                </div>
                <div id="action-btn">▲</div>
                <div id="tap-hint">Тап = стрибок / дія</div>
            </div>

        </div>
    </div>

<script>
    let playerImgSrc = '';
    let playerImage = new Image();
    
    // Ігрові змінні
    let canvas = document.getElementById('gameCanvas');
    let ctx = canvas.getContext('2d');
    let animationId;
    let currentGameType = '';
    let difficultyMultiplier = 1;
    let isGameOver = false;
    
    let score = 0;
    let lives = 3;
    let frames = 0;
    
    // Об'єкти
    let player = {};
    let obstacles = [];
    let items = [];

    // Керування клавіатурою
    let keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // === ТАЧСКРІН КЕРУВАННЯ ===
    let touch = { x: 0, y: 0, active: false, joystickDX: 0, joystickDY: 0, actionPressed: false, actionJustPressed: false };
    let joystickOrigin = { x: 0, y: 0 };
    let joystickActive = false;
    let lastActionState = false;

    const joystickZone = document.getElementById('joystick-zone');
    const joystickKnob = document.getElementById('joystick-knob');
    const actionBtn = document.getElementById('action-btn');
    const mobileControls = document.getElementById('mobile-controls');

    // Знаходимо позицію джойстика
    function getJoystickRect() {
        return document.getElementById('joystick-base').getBoundingClientRect();
    }

    joystickZone.addEventListener('touchstart', e => {
        e.preventDefault();
        joystickActive = true;
        let t = e.touches[0];
        let rect = getJoystickRect();
        joystickOrigin.x = rect.left + rect.width/2;
        joystickOrigin.y = rect.top + rect.height/2;
        updateJoystick(t.clientX, t.clientY);
    }, { passive: false });

    joystickZone.addEventListener('touchmove', e => {
        e.preventDefault();
        if (joystickActive) updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    joystickZone.addEventListener('touchend', e => {
        e.preventDefault();
        joystickActive = false;
        touch.joystickDX = 0;
        touch.joystickDY = 0;
        joystickKnob.style.transform = 'translate(0,0)';
    }, { passive: false });

    function updateJoystick(cx, cy) {
        let dx = cx - joystickOrigin.x;
        let dy = cy - joystickOrigin.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        let maxR = 35;
        if (dist > maxR) { dx = dx/dist*maxR; dy = dy/dist*maxR; }
        joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
        touch.joystickDX = dx / maxR;
        touch.joystickDY = dy / maxR;
    }

    // Кнопка дії
    actionBtn.addEventListener('touchstart', e => {
        e.preventDefault();
        touch.actionPressed = true;
        touch.actionJustPressed = true;
    }, { passive: false });
    actionBtn.addEventListener('touchend', e => {
        e.preventDefault();
        touch.actionPressed = false;
    }, { passive: false });

    // Тап по канвасу (для ігор де тільки тап)
    canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        let t = e.touches[0];
        let rect = canvas.getBoundingClientRect();
        touch.x = (t.clientX - rect.left) * (canvas.width / rect.width);
        touch.y = (t.clientY - rect.top) * (canvas.height / rect.height);
        touch.active = true;
        touch.actionJustPressed = true;
        touch.actionPressed = true;
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
        e.preventDefault();
        let t = e.touches[0];
        let rect = canvas.getBoundingClientRect();
        touch.x = (t.clientX - rect.left) * (canvas.width / rect.width);
        touch.y = (t.clientY - rect.top) * (canvas.height / rect.height);
        touch.active = true;
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
        e.preventDefault();
        touch.active = false;
        touch.actionPressed = false;
    }, { passive: false });

    // Кліки мишею по канвасу (для ігор де тільки клік)
    canvas.addEventListener('mousedown', e => {
        let rect = canvas.getBoundingClientRect();
        touch.x = (e.clientX - rect.left) * (canvas.width / rect.width);
        touch.y = (e.clientY - rect.top) * (canvas.height / rect.height);
        touch.active = true;
        touch.actionJustPressed = true;
        touch.actionPressed = true;
    });
    canvas.addEventListener('mousemove', e => {
        let rect = canvas.getBoundingClientRect();
        touch.x = (e.clientX - rect.left) * (canvas.width / rect.width);
        touch.y = (e.clientY - rect.top) * (canvas.height / rect.height);
    });
    canvas.addEventListener('mouseup', () => { touch.active = false; touch.actionPressed = false; });

    // Показати мобільні контролі для потрібних ігор
    function updateMobileControls(type) {
        // Для painter і bubble - повний тач на канвасі, без джойстика
        if (['paint', 'bubble', 'maze'].includes(type)) {
            mobileControls.style.display = 'none';
            document.getElementById('tap-hint').style.display = 'block';
        } else if (['runner', 'flappy', 'gravity'].includes(type)) {
            joystickZone.style.display = 'none';
            actionBtn.style.display = 'flex';
            actionBtn.textContent = '▲';
            mobileControls.style.pointerEvents = 'none';
            actionBtn.style.pointerEvents = 'all';
            mobileControls.style.display = 'block';
        } else {
            joystickZone.style.display = 'block';
            actionBtn.style.display = 'flex';
            actionBtn.textContent = type === 'shooter' ? '🔥' : '▲';
            mobileControls.style.display = 'block';
        }
    }

    // Функції навігації
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => {
            s.classList.remove('active');
            if (s.id === 'screen-game') s.style.display = 'none';
        });
        
        if (screenId === 'screen-game') {
            document.getElementById(screenId).style.display = 'flex';
            document.getElementById('main-panel').style.display = 'none';
        } else {
            document.getElementById(screenId).classList.add('active');
            document.getElementById('main-panel').style.display = 'block';
        }
    }

    function selectCharacter(src) {
        playerImgSrc = src;
        playerImage.src = src;
        showScreen('screen-hub');
    }

    function startGame(type, diff) {
        currentGameType = type;
        difficultyMultiplier = diff;
        showScreen('screen-game');
        
        let title = "Гра";
        if(type === 'runner') title = diff > 1.5 ? "Турбо Забіг" : (diff > 1 ? "Швидкісний Раннер" : "Класичний Забіг");
        if(type === 'catcher') title = diff > 1.5 ? "Божевільний Ловець" : (diff > 1 ? "Метеоритний Дощ" : "Ловець Смаколиків");
        if(type === 'flappy') title = diff > 1.5 ? "Гравітаційна Аномалія" : (diff > 1 ? "Вузькі Печери" : "Повітряний Політ");
        if(type === 'survival') title = "Режим Виживання";
        if(type === 'snake') title = "🐍 Змійка";
        if(type === 'breakout') title = "🧱 Розбиватель Блоків";
        if(type === 'maze') title = "🌿 Лабіринт — веди пальцем!";
        if(type === 'shooter') title = "🎯 Зоряний Стрілець";
        if(type === 'bounce') title = "⚽ Відбивайло";
        if(type === 'gravity') title = "🪐 Гравітаційний Стрибун";
        if(type === 'paint') title = "🎨 Маляр — малюй пальцем!";
        if(type === 'dodge') title = "💨 Ухилятор";
        if(type === 'collector') title = "⭐ Збирач Зірок";
        if(type === 'bubble') title = "🫧 Бульбашки — лопай тапом!";

        document.getElementById('game-title').innerText = title;
        updateMobileControls(type);
        resetGame();
    }

    function exitGame() {
        cancelAnimationFrame(animationId);
        showScreen('screen-hub');
    }

    document.getElementById('restart-btn').onclick = resetGame;

    function resetGame() {
        cancelAnimationFrame(animationId);
        document.getElementById('game-over').style.display = 'none';
        score = 0;
        lives = 3;
        frames = 0;
        isGameOver = false;
        obstacles = [];
        items = [];
        touch.actionJustPressed = false;
        lastActionState = false;
        updateHUD();

        if (currentGameType === 'runner') {
            player = { x: 50, y: 400, w: 50, h: 50, dy: 0, gravity: 0.8, jumpPower: -15, grounded: false };
        } else if (currentGameType === 'catcher') {
            player = { x: 375, y: 430, w: 60, h: 60, speed: 7 * difficultyMultiplier };
        } else if (currentGameType === 'flappy') {
            player = { x: 100, y: 200, w: 40, h: 40, dy: 0, gravity: 0.5 * difficultyMultiplier, jumpPower: -8 };
        } else if (currentGameType === 'survival') {
            player = { x: 375, y: 225, w: 40, h: 40, speed: 5 };
        } else if (currentGameType === 'snake') {
            initSnake();
        } else if (currentGameType === 'breakout') {
            initBreakout();
        } else if (currentGameType === 'maze') {
            initMaze();
        } else if (currentGameType === 'shooter') {
            initShooter();
        } else if (currentGameType === 'bounce') {
            initBounce();
        } else if (currentGameType === 'gravity') {
            player = { x: 100, y: 200, w: 44, h: 44, dy: 0, gravity: 0.6 * difficultyMultiplier, jumpPower: -12, grounded: false, lane: 1 };
            obstacles = []; items = [];
        } else if (currentGameType === 'paint') {
            initPaint();
        } else if (currentGameType === 'dodge') {
            player = { x: 400, y: 250, w: 40, h: 40, speed: 6 };
            obstacles = []; items = [];
        } else if (currentGameType === 'collector') {
            player = { x: 375, y: 225, w: 44, h: 44, speed: 6 };
            items = [];
        } else if (currentGameType === 'bubble') {
            initBubble();
        }

        gameLoop();
    }

    function updateHUD() {
        document.getElementById('scoreDisplay').innerText = `Рахунок: ${score}`;
        document.getElementById('livesDisplay').innerText = `Життя: ${lives}`;
    }

    function drawPlayer() {
        if (playerImage.complete && playerImage.naturalHeight !== 0) {
            ctx.drawImage(playerImage, player.x, player.y, player.w, player.h);
        } else {
            ctx.fillStyle = '#fff';
            ctx.fillRect(player.x, player.y, player.w, player.h);
        }
    }

    // Головний ігровий цикл
    function gameLoop() {
        if (isGameOver) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        frames++;

        if (currentGameType === 'runner') updateRunner();
        else if (currentGameType === 'catcher') updateCatcher();
        else if (currentGameType === 'flappy') updateFlappy();
        else if (currentGameType === 'survival') updateSurvival();
        else if (currentGameType === 'snake') updateSnake();
        else if (currentGameType === 'breakout') updateBreakout();
        else if (currentGameType === 'maze') updateMaze();
        else if (currentGameType === 'shooter') updateShooter();
        else if (currentGameType === 'bounce') updateBounce();
        else if (currentGameType === 'gravity') updateGravity();
        else if (currentGameType === 'paint') updatePaint();
        else if (currentGameType === 'dodge') updateDodge();
        else if (currentGameType === 'collector') updateCollector();
        else if (currentGameType === 'bubble') updateBubble();

        // Скидаємо "just pressed" після одного кадру
        touch.actionJustPressed = false;

        updateHUD();
        animationId = requestAnimationFrame(gameLoop);
    }

    function gameOver() {
        isGameOver = true;
        document.getElementById('game-over').style.display = 'block';
        document.getElementById('final-score').innerText = `Ваш рахунок: ${score}`;
    }

    // ===== МЕХАНІКА 1: РАННЕР =====
    function updateRunner() {
        player.y += player.dy;
        if (player.y + player.h < 450) {
            player.dy += player.gravity;
            player.grounded = false;
        } else {
            player.y = 450 - player.h;
            player.dy = 0;
            player.grounded = true;
        }

        // Стрибок: клавіатура АБО тап/кнопка
        let jumpPressed = keys['Space'] || keys['ArrowUp'] || touch.actionJustPressed;
        if (jumpPressed && player.grounded) {
            player.dy = player.jumpPower;
            touch.actionJustPressed = false;
        }

        ctx.fillStyle = '#4CAF50';
        ctx.fillRect(0, 450, canvas.width, 50);

        if (frames % Math.floor(100 / difficultyMultiplier) === 0) {
            let h = 40 + Math.random() * 40;
            obstacles.push({ x: canvas.width, y: 450 - h, w: 30, h: h, speed: 6 * difficultyMultiplier });
        }

        ctx.fillStyle = '#FF5722';
        for (let i = 0; i < obstacles.length; i++) {
            let obs = obstacles[i];
            obs.x -= obs.speed;
            ctx.fillRect(obs.x, obs.y, obs.w, obs.h);

            if (player.x < obs.x + obs.w && player.x + player.w > obs.x &&
                player.y < obs.y + obs.h && player.y + player.h > obs.y) {
                gameOver();
            }

            if (obs.x + obs.w < 0) {
                obstacles.splice(i, 1);
                score += 10;
                i--;
            }
        }
        drawPlayer();
    }

    // ===== МЕХАНІКА 2: ЛОВЕЦЬ =====
    function updateCatcher() {
        // Клавіатура
        if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
        if (keys['ArrowRight'] && player.x < canvas.width - player.w) player.x += player.speed;
        // Тач/джойстик
        if (touch.joystickDX !== 0) {
            player.x += touch.joystickDX * player.speed * 1.5;
            player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));
        }
        // Тап по канвасу — переміщення до пальця
        if (touch.active && !joystickActive) {
            let targetX = touch.x - player.w/2;
            targetX = Math.max(0, Math.min(canvas.width - player.w, targetX));
            player.x += (targetX - player.x) * 0.2;
        }

        if (frames % Math.floor(40 / difficultyMultiplier) === 0) {
            let isBad = Math.random() < 0.3;
            items.push({
                x: Math.random() * (canvas.width - 30),
                y: -30, w: 30, h: 30,
                speed: (3 + Math.random() * 3) * difficultyMultiplier,
                bad: isBad
            });
        }

        for (let i = 0; i < items.length; i++) {
            let item = items[i];
            item.y += item.speed;
            ctx.fillStyle = item.bad ? '#F44336' : '#FFEB3B';
            ctx.beginPath();
            ctx.arc(item.x + item.w/2, item.y + item.h/2, item.w/2, 0, Math.PI * 2);
            ctx.fill();

            if (player.x < item.x + item.w && player.x + player.w > item.x &&
                player.y < item.y + item.h && player.y + player.h > item.y) {
                if (item.bad) { lives--; if (lives <= 0) gameOver(); }
                else { score += 5; }
                items.splice(i, 1); i--; continue;
            }

            if (item.y > canvas.height) {
                if (!item.bad) { lives--; if (lives <= 0) gameOver(); }
                items.splice(i, 1); i--;
            }
        }
        drawPlayer();
    }

    // ===== МЕХАНІКА 3: ПОЛІТ (FLAPPY) =====
    let lastFlapSpace = false;
    function updateFlappy() {
        player.dy += player.gravity;
        player.y += player.dy;

        let flapPressed = (keys['Space'] || keys['ArrowUp']) && !lastFlapSpace;
        let tapFlap = touch.actionJustPressed;
        if (flapPressed || tapFlap) {
            player.dy = player.jumpPower;
            touch.actionJustPressed = false;
        }
        lastFlapSpace = keys['Space'] || keys['ArrowUp'];

        if (player.y < 0) player.y = 0;
        if (player.y + player.h > canvas.height) gameOver();

        let gap = 150 - (difficultyMultiplier * 20);
        if (frames % Math.floor(120 / difficultyMultiplier) === 0) {
            let topHeight = 50 + Math.random() * (canvas.height - gap - 100);
            obstacles.push({ x: canvas.width, y: 0, w: 50, h: topHeight, passed: false });
            obstacles.push({ x: canvas.width, y: topHeight + gap, w: 50, h: canvas.height - topHeight - gap, passed: false });
        }

        ctx.fillStyle = '#00BCD4';
        for (let i = 0; i < obstacles.length; i++) {
            let obs = obstacles[i];
            obs.x -= 4 * difficultyMultiplier;
            ctx.fillRect(obs.x, obs.y, obs.w, obs.h);

            if (player.x < obs.x + obs.w && player.x + player.w > obs.x &&
                player.y < obs.y + obs.h && player.y + player.h > obs.y) {
                gameOver();
            }

            if (obs.y === 0 && !obs.passed && player.x > obs.x + obs.w) {
                score += 10; obs.passed = true;
            }

            if (obs.x + obs.w < 0) { obstacles.splice(i, 1); i--; }
        }
        drawPlayer();
    }

    // ===== МЕХАНІКА 4: ВИЖИВАННЯ =====
    function updateSurvival() {
        if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
        if (keys['ArrowRight'] && player.x < canvas.width - player.w) player.x += player.speed;
        if (keys['ArrowUp'] && player.y > 0) player.y -= player.speed;
        if (keys['ArrowDown'] && player.y < canvas.height - player.h) player.y += player.speed;

        // Джойстик / тап
        if (touch.joystickDX !== 0 || touch.joystickDY !== 0) {
            player.x += touch.joystickDX * player.speed * 1.5;
            player.y += touch.joystickDY * player.speed * 1.5;
        } else if (touch.active && !joystickActive) {
            let tx = touch.x - player.w/2;
            let ty = touch.y - player.h/2;
            player.x += (tx - player.x) * 0.15;
            player.y += (ty - player.y) * 0.15;
        }
        player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));
        player.y = Math.max(0, Math.min(canvas.height - player.h, player.y));

        if (frames % 60 === 0) score++;

        if (frames % 20 === 0) {
            let side = Math.floor(Math.random() * 4);
            let item = { w: 20, h: 20, speedX: 0, speedY: 0 };
            let speed = 4 + Math.random() * 4;
            if (side === 0) { item.x = Math.random()*canvas.width; item.y = -20; item.speedY = speed; }
            if (side === 1) { item.x = Math.random()*canvas.width; item.y = canvas.height; item.speedY = -speed; }
            if (side === 2) { item.x = -20; item.y = Math.random()*canvas.height; item.speedX = speed; }
            if (side === 3) { item.x = canvas.width; item.y = Math.random()*canvas.height; item.speedX = -speed; }
            items.push(item);
        }

        ctx.fillStyle = '#E91E63';
        for (let i = 0; i < items.length; i++) {
            let item = items[i];
            item.x += item.speedX; item.y += item.speedY;
            ctx.fillRect(item.x, item.y, item.w, item.h);

            if (player.x < item.x + item.w && player.x + player.w > item.x &&
                player.y < item.y + item.h && player.y + player.h > item.y) {
                gameOver();
            }

            if (item.x < -50 || item.x > canvas.width + 50 || item.y < -50 || item.y > canvas.height + 50) {
                items.splice(i, 1); i--;
            }
        }
        drawPlayer();
    }

    // ===================================================
    // ============ НОВІ ІГРИ ============================
    // ===================================================

    // ===== ГРА 11: ЗМІЙКА =====
    let snake, snakeDir, snakeFood, snakeGrowth, snakeMoveTimer;
    function initSnake() {
        snake = [{x:10, y:10},{x:9,y:10},{x:8,y:10}];
        snakeDir = {x:1, y:0};
        snakeFood = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*15)};
        snakeGrowth = 0;
        snakeMoveTimer = 0;
        lives = 1;
    }

    function updateSnake() {
        const cell = 25;
        // Напрямок — клавіатура
        if (keys['ArrowLeft'] && snakeDir.x !== 1) snakeDir = {x:-1,y:0};
        if (keys['ArrowRight'] && snakeDir.x !== -1) snakeDir = {x:1,y:0};
        if (keys['ArrowUp'] && snakeDir.y !== 1) snakeDir = {x:0,y:-1};
        if (keys['ArrowDown'] && snakeDir.y !== -1) snakeDir = {x:0,y:1};
        // Джойстик
        if (Math.abs(touch.joystickDX) > 0.4 || Math.abs(touch.joystickDY) > 0.4) {
            if (Math.abs(touch.joystickDX) > Math.abs(touch.joystickDY)) {
                if (touch.joystickDX > 0 && snakeDir.x !== -1) snakeDir = {x:1,y:0};
                if (touch.joystickDX < 0 && snakeDir.x !== 1) snakeDir = {x:-1,y:0};
            } else {
                if (touch.joystickDY > 0 && snakeDir.y !== -1) snakeDir = {x:0,y:1};
                if (touch.joystickDY < 0 && snakeDir.y !== 1) snakeDir = {x:0,y:-1};
            }
        }
        // Свайп по канвасу
        if (touch.actionJustPressed) {
            // тап по секторах екрану = напрямок
            let cx = touch.x, cy = touch.y;
            let head = snake[0];
            let hx = head.x * cell + cell/2;
            let hy = head.y * cell + cell/2;
            let dx = cx - hx, dy = cy - hy;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0 && snakeDir.x !== -1) snakeDir = {x:1,y:0};
                if (dx < 0 && snakeDir.x !== 1) snakeDir = {x:-1,y:0};
            } else {
                if (dy > 0 && snakeDir.y !== -1) snakeDir = {x:0,y:1};
                if (dy < 0 && snakeDir.y !== 1) snakeDir = {x:0,y:-1};
            }
        }

        snakeMoveTimer++;
        let speed = Math.max(4, 8 - Math.floor(score/30));
        if (snakeMoveTimer >= speed) {
            snakeMoveTimer = 0;
            let head = {x: snake[0].x + snakeDir.x, y: snake[0].y + snakeDir.y};
            if (head.x < 0 || head.x >= 32 || head.y < 0 || head.y >= 20) { gameOver(); return; }
            for (let s of snake) { if (s.x === head.x && s.y === head.y) { gameOver(); return; } }
            snake.unshift(head);
            if (head.x === snakeFood.x && head.y === snakeFood.y) {
                score += 10; snakeGrowth += 3;
                snakeFood = {x: Math.floor(Math.random()*32), y: Math.floor(Math.random()*20)};
            }
            if (snakeGrowth > 0) { snakeGrowth--; }
            else { snake.pop(); }
        }

        // Фон
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        // Їжа
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(snakeFood.x*cell+cell/2, snakeFood.y*cell+cell/2, cell/2-2, 0, Math.PI*2);
        ctx.fill();
        // Змійка
        for (let i = 0; i < snake.length; i++) {
            ctx.fillStyle = i === 0 ? '#00FF88' : '#00BB66';
            ctx.fillRect(snake[i].x*cell+1, snake[i].y*cell+1, cell-2, cell-2);
        }
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.font = '12px Arial';
        ctx.fillText('Тапни у напрямку руху', 10, canvas.height - 10);
    }

    // ===== ГРА 12: BREAKOUT =====
    let ball, paddle, bricks;
    function initBreakout() {
        ball = {x:400, y:350, vx:4, vy:-5, r:10};
        paddle = {x:330, y:460, w:140, h:15};
        bricks = [];
        let colors = ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db','#9b59b6'];
        for (let r=0; r<4; r++) {
            for (let c=0; c<10; c++) {
                bricks.push({x:30+c*75, y:40+r*35, w:68, h:28, alive:true, color:colors[r]});
            }
        }
        lives = 3;
    }

    function updateBreakout() {
        // Весло: клавіатура, джойстик, або тап/слідкування за пальцем
        if (keys['ArrowLeft']) paddle.x -= 8;
        if (keys['ArrowRight']) paddle.x += 8;
        if (touch.joystickDX !== 0) paddle.x += touch.joystickDX * 10;
        if (touch.active && !joystickActive) {
            paddle.x = touch.x - paddle.w/2;
        }
        paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, paddle.x));

        ball.x += ball.vx * difficultyMultiplier;
        ball.y += ball.vy * difficultyMultiplier;
        if (ball.x - ball.r < 0 || ball.x + ball.r > canvas.width) ball.vx *= -1;
        if (ball.y - ball.r < 0) ball.vy *= -1;
        if (ball.y + ball.r > canvas.height) { lives--; if (lives <= 0) { gameOver(); return; } ball = {x:400,y:350,vx:4,vy:-5,r:10}; }

        if (ball.y + ball.r > paddle.y && ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
            ball.vy = -Math.abs(ball.vy);
            ball.vx = ((ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2)) * 6;
        }

        let allDead = true;
        for (let b of bricks) {
            if (!b.alive) continue;
            allDead = false;
            if (ball.x > b.x && ball.x < b.x+b.w && ball.y-ball.r < b.y+b.h && ball.y+ball.r > b.y) {
                b.alive = false; ball.vy *= -1; score += 5;
            }
        }
        if (allDead) { score += 50; initBreakout(); return; }

        // Фон
        ctx.fillStyle = '#0f0f23';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        // Блоки
        for (let b of bricks) {
            if (!b.alive) continue;
            ctx.fillStyle = b.color;
            ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.strokeRect(b.x, b.y, b.w, b.h);
        }
        // Весло
        ctx.fillStyle = '#fff';
        ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
        // М'яч
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.font = '12px Arial';
        ctx.fillText('Слідкуй пальцем за кулею!', 10, canvas.height - 10);
    }

    // ===== ГРА 13: ЛАБІРИНТ =====
    let maze, mazePlayer, mazeCells, mazeW = 13, mazeH = 9, mazeCellSize = 55;
    function initMaze() {
        mazeCellSize = Math.min(Math.floor(canvas.width / (mazeW+1)), Math.floor(canvas.height / (mazeH+1)));
        mazeCells = generateMaze(mazeW, mazeH);
        mazePlayer = {x:0, y:0};
        lives = 1;
        // Фінальна клітинка
        maze = {goalX: mazeW-1, goalY: mazeH-1};
    }

    function generateMaze(w, h) {
        let cells = [];
        for (let y=0; y<h; y++) { cells[y] = []; for (let x=0; x<w; x++) cells[y][x] = {top:true,right:true,bottom:true,left:true,visited:false}; }
        function carve(x, y) {
            cells[y][x].visited = true;
            let dirs = [{dx:1,dy:0,wall:'right',opp:'left'},{dx:-1,dy:0,wall:'left',opp:'right'},{dx:0,dy:1,wall:'bottom',opp:'top'},{dx:0,dy:-1,wall:'top',opp:'bottom'}];
            dirs.sort(()=>Math.random()-0.5);
            for (let d of dirs) {
                let nx=x+d.dx, ny=y+d.dy;
                if (nx>=0&&nx<w&&ny>=0&&ny<h&&!cells[ny][nx].visited) {
                    cells[y][x][d.wall]=false; cells[ny][nx][d.opp]=false; carve(nx,ny);
                }
            }
        }
        carve(0,0);
        return cells;
    }

    let lastMazeTapX = -1, lastMazeTapY = -1;
    function updateMaze() {
        // Клавіатура
        if (touch.actionJustPressed) {
            // тап у напрямку
            let mp = mazePlayer;
            let cellPxX = 20 + mp.x * mazeCellSize + mazeCellSize/2;
            let cellPxY = 20 + mp.y * mazeCellSize + mazeCellSize/2;
            let dx = touch.x - cellPxX, dy = touch.y - cellPxY;
            let cell = mazeCells[mp.y][mp.x];
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0 && !cell.right && mp.x < mazeW-1) mp.x++;
                if (dx < 0 && !cell.left && mp.x > 0) mp.x--;
            } else {
                if (dy > 0 && !cell.bottom && mp.y < mazeH-1) mp.y++;
                if (dy < 0 && !cell.top && mp.y > 0) mp.y--;
            }
        }
        if (keys['ArrowRight'] && !mazeCells[mazePlayer.y][mazePlayer.x].right && mazePlayer.x<mazeW-1) { mazePlayer.x++; keys['ArrowRight']=false; }
        if (keys['ArrowLeft'] && !mazeCells[mazePlayer.y][mazePlayer.x].left && mazePlayer.x>0) { mazePlayer.x--; keys['ArrowLeft']=false; }
        if (keys['ArrowDown'] && !mazeCells[mazePlayer.y][mazePlayer.x].bottom && mazePlayer.y<mazeH-1) { mazePlayer.y++; keys['ArrowDown']=false; }
        if (keys['ArrowUp'] && !mazeCells[mazePlayer.y][mazePlayer.x].top && mazePlayer.y>0) { mazePlayer.y--; keys['ArrowUp']=false; }
        if (touch.joystickDX !== 0 || touch.joystickDY !== 0) {
            // Джойстик
        }

        if (frames % 60 === 0) score++;
        if (mazePlayer.x === maze.goalX && mazePlayer.y === maze.goalY) { score += 100; initMaze(); }

        // Малюємо
        ctx.fillStyle = '#0f0f23'; ctx.fillRect(0,0,canvas.width,canvas.height);
        let ox=20, oy=20, cs=mazeCellSize;
        ctx.strokeStyle = '#7fdbff'; ctx.lineWidth = 2;
        for (let y=0; y<mazeH; y++) {
            for (let x=0; x<mazeW; x++) {
                let c = mazeCells[y][x];
                let px = ox+x*cs, py = oy+y*cs;
                ctx.beginPath();
                if (c.top) { ctx.moveTo(px,py); ctx.lineTo(px+cs,py); }
                if (c.right) { ctx.moveTo(px+cs,py); ctx.lineTo(px+cs,py+cs); }
                if (c.bottom) { ctx.moveTo(px,py+cs); ctx.lineTo(px+cs,py+cs); }
                if (c.left) { ctx.moveTo(px,py); ctx.lineTo(px,py+cs); }
                ctx.stroke();
            }
        }
        // Фінал
        ctx.fillStyle = '#FFD700';
        ctx.fillRect(ox+maze.goalX*cs+5, oy+maze.goalY*cs+5, cs-10, cs-10);
        // Гравець
        let px2 = ox+mazePlayer.x*cs, py2 = oy+mazePlayer.y*cs;
        if (playerImage.complete && playerImage.naturalHeight !== 0) {
            ctx.drawImage(playerImage, px2+3, py2+3, cs-6, cs-6);
        } else {
            ctx.fillStyle = '#00FF88';
            ctx.fillRect(px2+5, py2+5, cs-10, cs-10);
        }
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.font = '12px Arial';
        ctx.fillText('Тапай у сторону куди йти', 10, canvas.height-10);
    }

    // ===== ГРА 14: СТРІЛЕЦЬ =====
    let bullets, enemies, shootTimer;
    function initShooter() {
        bullets = []; enemies = []; shootTimer = 0;
        player = {x:380, y:430, w:40, h:40, speed:5};
        lives = 3;
    }

    function updateShooter() {
        // Рух: клавіатура, джойстик, тап
        if (keys['ArrowLeft']) player.x -= player.speed;
        if (keys['ArrowRight']) player.x += player.speed;
        if (touch.joystickDX !== 0) player.x += touch.joystickDX * player.speed * 1.5;
        if (touch.active && !joystickActive) player.x += (touch.x - player.w/2 - player.x) * 0.15;
        player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

        // Стрільба: пробіл або кнопка-дія або авто
        shootTimer++;
        let autoShoot = shootTimer % 20 === 0;
        let manualShoot = keys['Space'] || touch.actionPressed;
        if (autoShoot || (manualShoot && shootTimer % 10 === 0)) {
            bullets.push({x: player.x + player.w/2, y: player.y, r:6, speed:9});
        }

        // Вороги
        if (frames % Math.floor(60 / difficultyMultiplier) === 0) {
            enemies.push({x: Math.random()*(canvas.width-40), y:-40, w:40, h:40, speed:2+Math.random()*2*difficultyMultiplier, hp:2});
        }

        ctx.fillStyle = '#0f0f23'; ctx.fillRect(0,0,canvas.width,canvas.height);

        // Малюємо зірки
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        for (let i=0; i<50; i++) {
            let sx = (i*137+frames)%canvas.width;
            let sy = (i*53+frames*0.5)%canvas.height;
            ctx.fillRect(sx,sy,1.5,1.5);
        }

        // Кулі
        ctx.fillStyle = '#FFD700';
        for (let i=0; i<bullets.length; i++) {
            bullets[i].y -= bullets[i].speed;
            ctx.beginPath();
            ctx.arc(bullets[i].x, bullets[i].y, bullets[i].r, 0, Math.PI*2);
            ctx.fill();
            if (bullets[i].y < 0) { bullets.splice(i,1); i--; continue; }

            for (let j=0; j<enemies.length; j++) {
                let e = enemies[j];
                if (bullets[i] && bullets[i].x > e.x && bullets[i].x < e.x+e.w && bullets[i].y > e.y && bullets[i].y < e.y+e.h) {
                    e.hp--;
                    bullets.splice(i,1); i--;
                    if (e.hp <= 0) { enemies.splice(j,1); score+=15; }
                    break;
                }
            }
        }

        // Вороги
        for (let i=0; i<enemies.length; i++) {
            let e = enemies[i];
            e.y += e.speed;
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(e.x, e.y, e.w, e.h);
            ctx.fillStyle = '#ff8888';
            ctx.fillRect(e.x+5,e.y+5,e.w-10,e.h-10);

            if (e.y > canvas.height) { enemies.splice(i,1); i--; lives--; if(lives<=0){gameOver();return;} continue; }
            if (player.x < e.x+e.w && player.x+player.w > e.x && player.y < e.y+e.h && player.y+player.h > e.y) { gameOver(); return; }
        }

        drawPlayer();
        ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.font='12px Arial';
        ctx.fillText('Кнопка 🔥 або пробіл — стріляй!', 10, canvas.height-10);
    }

    // ===== ГРА 15: ВІДБИВАЙЛО (PONG-LIKE) =====
    let bounceBall, bouncePaddle, bounceAI;
    function initBounce() {
        bounceBall = {x:400,y:250,vx:5,vy:4,r:12};
        bouncePaddle = {x:10, y:200, w:15, h:100};
        bounceAI = {x:775, y:200, w:15, h:100};
        lives = 5;
    }
    function updateBounce() {
        // Весло гравця: джойстик Y, або слідкування за пальцем
        if (keys['ArrowUp']) bouncePaddle.y -= 8;
        if (keys['ArrowDown']) bouncePaddle.y += 8;
        if (touch.joystickDY !== 0) bouncePaddle.y += touch.joystickDY * 10;
        if (touch.active && !joystickActive) bouncePaddle.y = touch.y - bouncePaddle.h/2;
        bouncePaddle.y = Math.max(0, Math.min(canvas.height - bouncePaddle.h, bouncePaddle.y));

        // AI
        if (bounceAI.y + bounceAI.h/2 < bounceBall.y) bounceAI.y += 4;
        else bounceAI.y -= 4;

        bounceBall.x += bounceBall.vx * difficultyMultiplier;
        bounceBall.y += bounceBall.vy * difficultyMultiplier;
        if (bounceBall.y - bounceBall.r < 0 || bounceBall.y + bounceBall.r > canvas.height) bounceBall.vy *= -1;

        // Відбивання від весел
        if (bounceBall.x - bounceBall.r < bouncePaddle.x + bouncePaddle.w && bounceBall.y > bouncePaddle.y && bounceBall.y < bouncePaddle.y + bouncePaddle.h) {
            bounceBall.vx = Math.abs(bounceBall.vx); score += 2;
        }
        if (bounceBall.x + bounceBall.r > bounceAI.x && bounceBall.y > bounceAI.y && bounceBall.y < bounceAI.y + bounceAI.h) {
            bounceBall.vx = -Math.abs(bounceBall.vx); score += 1;
        }

        if (bounceBall.x < 0) { lives--; if(lives<=0){gameOver();return;} bounceBall={x:400,y:250,vx:5,vy:4,r:12}; }
        if (bounceBall.x > canvas.width) { score += 5; bounceBall={x:400,y:250,vx:-5,vy:4,r:12}; }

        ctx.fillStyle = '#0f0f23'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.setLineDash([10,10]); ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(canvas.width/2,0); ctx.lineTo(canvas.width/2,canvas.height); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = '#fff'; ctx.fillRect(bouncePaddle.x, bouncePaddle.y, bouncePaddle.w, bouncePaddle.h);
        ctx.fillStyle = '#e74c3c'; ctx.fillRect(bounceAI.x, bounceAI.y, bounceAI.w, bounceAI.h);
        ctx.fillStyle = '#FFD700'; ctx.beginPath(); ctx.arc(bounceBall.x, bounceBall.y, bounceBall.r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.font='12px Arial';
        ctx.fillText('Веди пальцем — керуй веслом!', 10, canvas.height-10);
    }

    // ===== ГРА 16: ГРАВІТАЦІЙНИЙ СТРИБУН =====
    let gravityLanes = [125, 250, 375];
    function updateGravity() {
        player.dy += player.gravity;
        player.y += player.dy;

        // Стрибок + зміна доріжки
        let jumpPressed = keys['Space'] || keys['ArrowUp'] || touch.actionJustPressed;
        if (jumpPressed && player.grounded) { player.dy = player.jumpPower; touch.actionJustPressed = false; }
        if ((keys['ArrowLeft'] || touch.joystickDX < -0.4) && player.lane > 0) { player.lane--; keys['ArrowLeft']=false; }
        if ((keys['ArrowRight'] || touch.joystickDX > 0.4) && player.lane < 2) { player.lane++; keys['ArrowRight']=false; }

        let targetX = gravityLanes[player.lane] - player.w/2;
        player.x += (targetX - player.x) * 0.2;

        let ground = 440;
        if (player.y + player.h >= ground) { player.y = ground - player.h; player.dy = 0; player.grounded = true; }
        else player.grounded = false;
        if (player.y < 0) player.y = 0;

        // Планети-перешкоди
        if (frames % Math.floor(70 / difficultyMultiplier) === 0) {
            let lane = Math.floor(Math.random()*3);
            obstacles.push({x: gravityLanes[lane]-25, y:-50, w:50, h:50, lane:lane, speed:5*difficultyMultiplier});
        }

        ctx.fillStyle = '#0f0f23'; ctx.fillRect(0,0,canvas.width,canvas.height);
        // Зірки
        for(let i=0;i<80;i++){ctx.fillStyle='rgba(255,255,255,0.4)';ctx.fillRect((i*97+frames*0.3)%canvas.width,(i*61+frames*0.2)%canvas.height,1.5,1.5);}
        // Доріжки
        for(let l of gravityLanes){ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.setLineDash([5,15]);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(l,0);ctx.lineTo(l,canvas.height);ctx.stroke();ctx.setLineDash([]);}
        // Земля
        ctx.fillStyle='#3a3a5c'; ctx.fillRect(0, ground, canvas.width, canvas.height-ground);

        ctx.fillStyle='#9b59b6';
        for(let i=0;i<obstacles.length;i++){
            let o=obstacles[i]; o.y+=o.speed;
            ctx.beginPath(); ctx.arc(o.x+25, o.y+25, 25, 0, Math.PI*2); ctx.fill();
            if(player.x<o.x+o.w&&player.x+player.w>o.x&&player.y<o.y+o.h&&player.y+player.h>o.y){gameOver();return;}
            if(o.y>canvas.height){obstacles.splice(i,1);score+=10;i--;}
        }
        drawPlayer();
        ctx.fillStyle='rgba(255,255,255,0.3)';ctx.font='12px Arial';
        ctx.fillText('Джойстик = доріжка | Кнопка = стрибок',10,canvas.height-10);
    }

    // ===== ГРА 17: МАЛЯР =====
    let paintCanvas, paintCtx, paintColor, paintColors, paintGoal, paintScore2, paintBrushSize;
    function initPaint() {
        paintColors = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c'];
        paintColor = paintColors[0];
        paintGoal = Math.floor(40 + Math.random()*40);
        paintScore2 = 0;
        paintBrushSize = 12;
        // Очищаємо канвас
        ctx.fillStyle = '#fdf6e3';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        lives = 1;
    }

    function updatePaint() {
        // Малюємо якщо тач або миша активна
        if (touch.active) {
            ctx.fillStyle = paintColor;
            ctx.beginPath();
            ctx.arc(touch.x, touch.y, paintBrushSize, 0, Math.PI*2);
            ctx.fill();
            score++;
        }

        // Палітра зверху
        let pw = 50;
        for (let i=0; i<paintColors.length; i++) {
            ctx.fillStyle = paintColors[i];
            ctx.fillRect(10+i*(pw+5), 5, pw, 30);
            if (paintColor === paintColors[i]) {
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.strokeRect(10+i*(pw+5), 5, pw, 30);
            }
        }
        // Кнопка очищення
        ctx.fillStyle = '#333';
        ctx.fillRect(canvas.width-70, 5, 65, 30);
        ctx.fillStyle = '#fff';
        ctx.font = '13px Arial';
        ctx.fillText('Очистити', canvas.width-68, 25);

        // Вибір кольору тапом
        if (touch.actionJustPressed) {
            if (touch.y < 40) {
                for (let i=0; i<paintColors.length; i++) {
                    if (touch.x >= 10+i*(pw+5) && touch.x <= 10+i*(pw+5)+pw) {
                        paintColor = paintColors[i];
                    }
                }
                if (touch.x > canvas.width-70) {
                    ctx.fillStyle = '#fdf6e3';
                    ctx.fillRect(0, 45, canvas.width, canvas.height-45);
                }
            }
        }

        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.font='13px Arial';
        ctx.fillText('Малюй пальцем!', 10, canvas.height-10);
    }

    // ===== ГРА 18: УХИЛЯТОР =====
    function updateDodge() {
        // Рух: джойстик, клавіатура, або слідкування за пальцем
        if (keys['ArrowLeft']) player.x -= player.speed;
        if (keys['ArrowRight']) player.x += player.speed;
        if (keys['ArrowUp']) player.y -= player.speed;
        if (keys['ArrowDown']) player.y += player.speed;
        if (touch.joystickDX !== 0) player.x += touch.joystickDX * player.speed * 1.5;
        if (touch.joystickDY !== 0) player.y += touch.joystickDY * player.speed * 1.5;
        if (touch.active && !joystickActive) {
            player.x += (touch.x - player.w/2 - player.x)*0.15;
            player.y += (touch.y - player.h/2 - player.y)*0.15;
        }
        player.x = Math.max(0,Math.min(canvas.width-player.w,player.x));
        player.y = Math.max(0,Math.min(canvas.height-player.h,player.y));

        if (frames % 60 === 0) score++;

        // Лазери (горизонтальні/вертикальні)
        if (frames % Math.floor(40/difficultyMultiplier) === 0) {
            let horiz = Math.random() < 0.5;
            if (horiz) {
                let y2 = Math.random() * (canvas.height-20);
                obstacles.push({x:canvas.width, y:y2, w:60, h:12, vx:-7*difficultyMultiplier, vy:0, horiz:true});
            } else {
                let x2 = Math.random() * (canvas.width-20);
                obstacles.push({x:x2, y:-60, w:12, h:60, vx:0, vy:7*difficultyMultiplier, horiz:false});
            }
        }

        ctx.fillStyle='#0f0f23'; ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.fillStyle='#ff4757';
        for(let i=0;i<obstacles.length;i++){
            let o=obstacles[i];
            o.x+=o.vx; o.y+=o.vy;
            // Неонове світіння
            ctx.shadowBlur=15; ctx.shadowColor='#ff4757';
            ctx.fillRect(o.x,o.y,o.w,o.h);
            ctx.shadowBlur=0;
            if(player.x<o.x+o.w&&player.x+player.w>o.x&&player.y<o.y+o.h&&player.y+player.h>o.y){gameOver();return;}
            if(o.x<-100||o.x>canvas.width+100||o.y<-100||o.y>canvas.height+100){obstacles.splice(i,1);i--;}
        }
        drawPlayer();
        ctx.fillStyle='rgba(255,255,255,0.3)';ctx.font='12px Arial';
        ctx.fillText('Веди пальцем за собою!',10,canvas.height-10);
    }

    // ===== ГРА 19: ЗБИРАЧ ЗІРОК =====
    function updateCollector() {
        if (keys['ArrowLeft']) player.x -= player.speed;
        if (keys['ArrowRight']) player.x += player.speed;
        if (keys['ArrowUp']) player.y -= player.speed;
        if (keys['ArrowDown']) player.y += player.speed;
        if (touch.joystickDX !== 0) player.x += touch.joystickDX * player.speed * 1.5;
        if (touch.joystickDY !== 0) player.y += touch.joystickDY * player.speed * 1.5;
        if (touch.active && !joystickActive) {
            player.x += (touch.x - player.w/2 - player.x)*0.15;
            player.y += (touch.y - player.h/2 - player.y)*0.15;
        }
        player.x = Math.max(0,Math.min(canvas.width-player.w,player.x));
        player.y = Math.max(0,Math.min(canvas.height-player.h,player.y));

        // Генерувати зірки та бомби
        if (items.length < 8) {
            let isBomb = Math.random() < 0.25;
            items.push({
                x: Math.random()*(canvas.width-30), y: Math.random()*(canvas.height-30),
                w:30, h:30, bomb: isBomb,
                vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2
            });
        }

        ctx.fillStyle='#1a1a2e'; ctx.fillRect(0,0,canvas.width,canvas.height);

        for(let i=0;i<items.length;i++){
            let it=items[i];
            it.x+=it.vx; it.y+=it.vy;
            if(it.x<0||it.x>canvas.width-it.w) it.vx*=-1;
            if(it.y<0||it.y>canvas.height-it.h) it.vy*=-1;

            if(it.bomb){
                ctx.fillStyle='#e74c3c'; ctx.font='24px Arial'; ctx.fillText('💣',it.x,it.y+24);
            } else {
                ctx.fillStyle='#FFD700';
                // Малюємо зірку
                drawStar(ctx, it.x+15, it.y+15, 5, 14, 6);
            }

            if(player.x<it.x+it.w&&player.x+player.w>it.x&&player.y<it.y+it.h&&player.y+player.h>it.y){
                if(it.bomb){ lives--; if(lives<=0){gameOver();return;} }
                else { score+=10; }
                items.splice(i,1); i--;
            }
        }
        drawPlayer();
        ctx.fillStyle='rgba(255,255,255,0.3)';ctx.font='12px Arial';
        ctx.fillText('Збирай зірки, уникай бомб!',10,canvas.height-10);
    }

    function drawStar(ctx, cx, cy, spikes, outerR, innerR) {
        ctx.save(); ctx.beginPath(); ctx.translate(cx, cy);
        let rot = Math.PI/2*3;
        let step = Math.PI/spikes;
        ctx.moveTo(0, -outerR);
        for(let i=0;i<spikes;i++){
            ctx.lineTo(Math.cos(rot)*outerR, Math.sin(rot)*outerR); rot+=step;
            ctx.lineTo(Math.cos(rot)*innerR, Math.sin(rot)*innerR); rot+=step;
        }
        ctx.lineTo(0,-outerR); ctx.closePath();
        ctx.fillStyle='#FFD700'; ctx.fill();
        ctx.restore();
    }

    // ===== ГРА 20: БУЛЬБАШКИ (тільки тап!) =====
    let bubbles;
    function initBubble() {
        bubbles = [];
        lives = 3;
        for(let i=0;i<10;i++) spawnBubble();
    }

    function spawnBubble() {
        let r = 20+Math.random()*30;
        let colors2 = ['#3498db','#2ecc71','#e74c3c','#f39c12','#9b59b6','#1abc9c','#e91e63'];
        bubbles.push({
            x: r + Math.random()*(canvas.width-r*2),
            y: canvas.height + r,
            r: r,
            speed: 0.5 + Math.random()*1.5,
            color: colors2[Math.floor(Math.random()*colors2.length)],
            points: Math.round(30/r*10),
            bomb: Math.random() < 0.15
        });
    }

    function updateBubble() {
        ctx.fillStyle='#0f2027'; ctx.fillRect(0,0,canvas.width,canvas.height);

        // Перевіряємо тап
        if (touch.actionJustPressed) {
            for(let i=bubbles.length-1;i>=0;i--){
                let b=bubbles[i];
                let dx=touch.x-b.x, dy=touch.y-b.y;
                if(dx*dx+dy*dy < b.r*b.r){
                    if(b.bomb){ lives--; if(lives<=0){gameOver();return;} }
                    else { score+=b.points; }
                    bubbles.splice(i,1);
                    spawnBubble();
                    break;
                }
            }
        }

        for(let i=0;i<bubbles.length;i++){
            let b=bubbles[i];
            b.y -= b.speed;

            // Малюємо бульбашку
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
            if(b.bomb){
                ctx.fillStyle='rgba(231,76,60,0.8)';
            } else {
                ctx.fillStyle = b.color.replace(')',',0.7)').replace('rgb','rgba');
                if(!ctx.fillStyle.includes('rgba')) ctx.fillStyle = b.color;
            }
            ctx.fill();
            ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=2; ctx.stroke();

            // Текст
            ctx.fillStyle='#fff'; ctx.font=`bold ${Math.floor(b.r*0.7)}px Arial`;
            ctx.textAlign='center'; ctx.textBaseline='middle';
            ctx.fillText(b.bomb ? '💣' : '+'+b.points, b.x, b.y);
            ctx.textAlign='left'; ctx.textBaseline='alphabetic';

            if(b.y + b.r < 0){
                if(!b.bomb){ lives--; if(lives<=0){gameOver();return;} }
                bubbles.splice(i,1); i--;
                spawnBubble();
            }
        }

        // Підказка
        ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='13px Arial';
        ctx.fillText('Лопай бульбашки тапом! 💣 = небезпека',10,canvas.height-10);
    }

</script>
